name = "lakeview-fellowship-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Local D1 binding (works without a Cloudflare account via wrangler dev --local)
[[d1_databases]]
binding = "DB"
database_name = "lakeview-fellowship"
database_id = "local-dev-placeholder"
